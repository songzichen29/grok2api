services:
  mihomo:
    container_name: grok2api-mihomo
    image: docker.m.daocloud.io/library/alpine:3.21
    command: ["/usr/local/bin/mihomo", "-d", "/config"]
    ports:
      - "127.0.0.1:17891:7890"
      - "127.0.0.1:19091:9090"
    volumes:
      - /usr/local/bin/mihomo:/usr/local/bin/mihomo:ro
      - ./data/mihomo:/config
    restart: unless-stopped

  grok2api:
    container_name: grok2api
    image: ghcr.io/songzichen29/grok2api:custom
    ports:
      # HOST_BIND 默认 0.0.0.0 直接对外；放反代后面时设为 127.0.0.1，并通过 HOST_PORT 换内部端口
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8000}:${SERVER_PORT:-8000}"
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8000}
      SERVER_WORKERS: ${SERVER_WORKERS:-1}
      ACCOUNT_STORAGE: ${ACCOUNT_STORAGE:-local}
      ACCOUNT_LOCAL_PATH: ${ACCOUNT_LOCAL_PATH:-data/accounts.db}
      ACCOUNT_REDIS_URL: ${ACCOUNT_REDIS_URL:-}
      ACCOUNT_MYSQL_URL: ${ACCOUNT_MYSQL_URL:-}
      ACCOUNT_POSTGRESQL_URL: ${ACCOUNT_POSTGRESQL_URL:-}

      # ACCOUNT_STORAGE: local | redis | mysql | postgresql
      # ACCOUNT_LOCAL_PATH: SQLite path when ACCOUNT_STORAGE=local
      # ACCOUNT_REDIS_URL: Redis DSN when ACCOUNT_STORAGE=redis
      # ACCOUNT_MYSQL_URL: MySQL DSN when ACCOUNT_STORAGE=mysql
      # ACCOUNT_POSTGRESQL_URL: PostgreSQL DSN when ACCOUNT_STORAGE=postgresql
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - mihomo
      - flaresolverr
    restart: unless-stopped

  # Warp 落地代理 (源作者推荐, 但 caomingjun/warp 的 cloudflare-warp daemon 在部分宿主会 hung)
  # 启用前先确认宿主能跑: 单独 docker run --privileged 启动一次看 daemon 是否能 ready
  # 启用后 config.toml proxy.egress.proxy_url 设为 socks5://warp:1080
  # warp:
  #   container_name: warp
  #   image: caomingjun/warp
  #   restart: always
  #   device_cgroup_rules:
  #     - 'c 10:200 rwm'
  #   environment:
  #     - WARP_SLEEP=2
  #   cap_add:
  #     - MKNOD
  #     - AUDIT_WRITE
  #     - NET_ADMIN
  #   sysctls:
  #     - net.ipv6.conf.all.disable_ipv6=0
  #     - net.ipv4.conf.all.src_valid_mark=1
  #   volumes:
  #     - ./data/warp:/var/lib/cloudflare-warp

  # CF 自动刷新: 与 grok2api 同 compose 网络, 容器内通过 http://flaresolverr:8191 访问
  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: info
    # 内部 Chrome 走 host 上的 mihomo 代理时也需要解析 host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mihomo
    restart: unless-stopped

# 固定 grok2api 专用桥接子网, 避免每次 compose up 抓取新段后被宿主机 iptables 拒绝出网代理
networks:
  default:
    name: grok2api_default
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1